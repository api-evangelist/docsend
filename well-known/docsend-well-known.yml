changes_since_last_round:
  checked: '2026-08-14'
  previous: '2026-07-18'
  notes: >-
    Two real changes since the 2026-07-18 round. (1) DocSend now publishes RFC 9728
    protected-resource metadata at /.well-known/oauth-protected-resource/mcp (HTTP 200,
    resource https://docsend.com/mcp) — it 404d on the last pass. (2) The advertised
    scope set was replaced: the coarse mcp:read / mcp:write pair is gone and both the
    authorization-server metadata and the WWW-Authenticate challenge now advertise five
    resource-scoped scopes — documents:read, spaces:read, spaces:write, analytics:read,
    contacts:read.
notes: >-
  DocSend publishes RFC 8414 OAuth authorization server metadata on both docsend.com
  (issuer https://docsend.com) and mcp.docsend.com (issuer https://mcp.docsend.com),
  plus RFC 9728 protected-resource metadata for the MCP resource. Dynamic client
  registration (RFC 7591) and PKCE (S256) are advertised. No security.txt, no OIDC
  discovery, no api-catalog, and no A2A agent card on either host.
