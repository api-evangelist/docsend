robots:
  url: https://www.docsend.com/robots.txt
  status: 200
  policy: 'User-Agent: * / Allow: /'
  sitemaps_point_to: https://www.docsend.lol/
  defect: >-
    Every one of the 16 Sitemap: lines in the production robots.txt points at
    www.docsend.lol, not www.docsend.com. docsend.lol is DocSend's own host (it resolves to
    a Heroku dyno, metric-macaw-lpjchjzh97lt77ta7t0tbxdx.herokudns.com) and serves the
    sitemap index with HTTP 200, so this is not a hijack — it looks like a staging/alt-TLD
    value that shipped to production. The effect is real: a crawler following
    www.docsend.com/robots.txt is sent to a different domain for every URL DocSend wants
    indexed, and www.docsend.com/sitemap.xml itself returns 404. Worth reporting to the
    provider.
  evidence:
  - {url: 'https://www.docsend.com/robots.txt', status: 200}
  - {url: 'https://www.docsend.lol/sitemap_index.xml', status: 200}
  - {url: 'https://www.docsend.com/sitemap.xml', status: 404}
