  authorization_endpoint: https://docsend.com/oauth/authorize
  token_endpoint: https://docsend.com/oauth/token
  registration_endpoint: https://docsend.com/oauth/register
  revocation_endpoint: https://docsend.com/oauth/revoke
  grant_types:
  - authorization_code
  - client_credentials
  - refresh_token
  code_challenge_methods:
  - S256
  bearer_methods_supported:
