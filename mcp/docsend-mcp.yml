  scopes:
  - documents:read
  - spaces:read
  - spaces:write
  - analytics:read
  - contacts:read
tools: []
tools_note: >-
  tools/list and initialize both return HTTP 401 without a bearer token, so the live tool
  set and its inputSchemas could not be enumerated. DocSend publishes no llms.txt and no
  MCP tool documentation on a readable host, so there is no anonymous fallback list —
  enumerating the tools requires an authenticated OAuth token. The server is confirmed
  live and published (401 auth challenge with a conformant RFC 9728 challenge, not a 404).
scope_surface_inference:
  note: >-
    Not a tool list. The five advertised OAuth scopes are the only anonymous evidence of
    what the server exposes, and they name four resource domains — documents, spaces
    (DocSend's virtual data rooms), analytics (viewer/page engagement), and contacts
    (visitors). Only spaces carries a write scope; documents, analytics and contacts are
    read-only, so the published agent surface is predominantly read-oriented.
  read_domains: [documents, spaces, analytics, contacts]
  write_domains: [spaces]
changes_since_last_round:
