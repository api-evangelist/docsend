server:
  name: docsend
  transport: http
  url: https://docsend.com/mcp
  alternate_url: https://mcp.docsend.com/mcp
  resource_identifier: https://docsend.com/mcp
  hosting: Heroku (behind CloudFront)
deployment:
  mode: remote
  endpoint: https://docsend.com/mcp
  auth: oauth
  verified: probed
  probe: gated
  checked: '2026-08-14'
  note: >-
    Both https://docsend.com/mcp and https://mcp.docsend.com/mcp answer an MCP POST with
    HTTP 401 and the same WWW-Authenticate challenge. The RFC 9728 protected-resource
    document names https://docsend.com/mcp as the canonical resource identifier, so that
